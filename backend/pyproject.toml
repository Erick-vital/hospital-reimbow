[project]
name = "reimbow-hospital"
version = "0.1.0"
description = "Base backend local de Reimbow HIS"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requiere hospital_test en PostgreSQL"]
